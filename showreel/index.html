<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anandi Productions — Showreel</title>
<meta name="description" content="Anandi Productions showreel: ad films, food and product films, CGI and AI content. Mumbai.">
<meta property="og:title" content="Anandi Productions — Showreel">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"AP Display";src:url(../assets/CodeProBold.otf) format("opentype");font-display:swap}
:root{--ink:#0d0d0d;--paper:#f4f1ea;--yellow:#fffc01}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
header img{height:34px;width:auto}
header a{color:var(--paper);text-decoration:none;font-size:14px;opacity:.75}
h1{font-family:"AP Display",Inter,sans-serif;font-size:clamp(34px,7vw,84px);line-height:.95;margin:0 0 10px;text-transform:uppercase}
h1 span{color:var(--yellow)}
.sub{font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(18px,2.6vw,26px);opacity:.85;margin:0 0 26px}
video{display:block;width:100%;height:auto;background:#000;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-block;padding:13px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.o{border:1px solid rgba(244,241,234,.4);color:var(--paper)}
footer{margin-top:40px;font-size:13px;opacity:.6;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="https://anandiproductions.com"><img src="../assets/logo-white-true.png" alt="Anandi Productions"></a>
    <a href="https://anandiproductions.com">anandiproductions.com</a>
  </header>
  <h1>Show<span>reel</span></h1>
  <p class="sub">Films, food and product, CGI and AI. Made in Mumbai.</p>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="anandi-productions-showreel.mp4" type="video/mp4">
  </video>
  <div class="row">
    <a class="btn y" href="https://anandiproductions.com/ai">See the AI work</a>
    <a class="btn o" href="https://anandiproductions.com/all-works">All films</a>
    <a class="btn o" href="mailto:hello@anandiproductions.com">hello@anandiproductions.com</a>
  </div>
  <footer>Anandi Productions · 233 A to Z Industrial Estate, GK Marg, Lower Parel, Mumbai</footer>
</div>
</body>
</html>
